<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Login</title>
    </head>
    <body>
        <h1>Login</h1>
        <form method="post">
            {% csrf_token %}
            <p>
                <label>Username:</label>
                <input type="text" name="username">
            </p>
            <p>
                <label>Password:</label>
                <input type="password" name="password">
            </p>
            <button type="submit">Login</button>
        </form>
        <a href="{% url 'game:signup' %}">Sign up</a>
    </body>
</html>
